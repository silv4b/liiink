[project]
name = "liiink"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "coverage>=7.13.4",
    "django>=6.0.2",
    "django-allauth>=65.14.3",
    "django-browser-reload>=1.21.0",
    "django-watchfiles>=1.4.0",
    "poethepoet>=0.41.0",
    "psycopg>=3.3.2",
    "psycopg2-binary>=2.9.11",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.12.0",
    "pytest-watch>=4.2.0",
    "python-dotenv>=1.2.1",
]

[tool.poe.tasks]
# Django tasks
runserver = "python manage.py runserver"
migrate = { shell = "python manage.py makemigrations && python manage.py migrate" }
update = { shell = "uv sync && uv pip freeze > requirements.txt" }

# Test Tasks
pytest = { shell = "pytest" }
coverage = { shell = "coverage run -m pytest" }
report = { shell = "coverage report" }
coveragehtml = { shell = "coverage html" }

[tool.poe.tasks.server]
sequence = ["runserver"]

[tool.poe.tasks.dev]
sequence = ["migrate", "runserver"]