[project]
name = "liiink"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.2",
    "django-allauth>=65.14.3",
    "gunicorn>=25.1.0",
    "psycopg>=3.3.2",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.30.1",
    "whitenoise>=6.11.0",
]

[tool.poe.tasks]
# Django tasks
runserver = "python manage.py runserver"
migrate = { shell = "python manage.py makemigrations && python manage.py migrate" }
static = { shell = "python manage.py collectstatic --noinput" }

# Test Tasks
pytest = { shell = "pytest" }
coverage = { shell = "coverage run -m pytest" }
report = { shell = "coverage report" }
coveragehtml = { shell = "coverage html" }

[tool.poe.tasks.server]
sequence = ["runserver"]

[tool.poe.tasks.dev]
sequence = ["migrate", "runserver"]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "django-browser-reload>=1.21.0",
    "django-watchfiles>=1.4.0",
    "dotenv>=0.9.9",
    "factory-boy>=3.3.3",
    "poethepoet>=0.41.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.12.0",
    "pytest-watch>=4.2.0",
]

# Add ao Dockerfile: RUN uv sync --frozen --no-dev
