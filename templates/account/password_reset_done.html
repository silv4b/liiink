{% extends 'base.html' %}

{% block title %}Email enviado - Liiink{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i data-lucide="mail-check" style="width: 48px; height: 48px; color: hsl(var(--primary)); margin-bottom: 1rem;"></i>
            <h1 style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em;">Verifique seu email</h1>
            <p style="color: hsl(var(--muted-foreground)); font-size: 0.875rem; margin-top: 0.5rem;">
                Enviamos instruções para {{ email }}. Caso não encontre, verifique a caixa de spam.
            </p>
        </div>

        <p style="text-align: center; margin-top: 2rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">
            <a href="{% url 'account_login' %}"
                style="color: hsl(var(--foreground)); font-weight: 600; text-decoration: none;">Voltar para login</a>
        </p>
    </div>
</div>
{% endblock %}
