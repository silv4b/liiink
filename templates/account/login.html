{% extends 'base.html' %}

{% block title %}Entrar - Liiink{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em;">Boas-vindas!</h1>
            <p style="color: hsl(var(--muted-foreground)); font-size: 0.875rem;">Entre com suas credenciais.</p>
        </div>

        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-error">
                E-mail ou senha incorretos.
            </div>
            {% endif %}

            <div class="form-group">
                <label class="form-label" for="id_login">E-mail ou Usuário</label>
                <input type="text" name="login" id="id_login" class="form-control" placeholder="seu@email.com" required
                    autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••"
                    required>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; height: 3rem; margin-top: 1rem;">Entrar</button>
        </form>

        <p style="text-align: center; margin-top: 2rem; font-size: 0.875rem; color: hsl(var(--muted-foreground));">
            Não tem uma conta? <a href="{% url 'account_signup' %}"
                style="color: hsl(var(--foreground)); font-weight: 600; text-decoration: none;">Crie uma agora</a>
        </p>
    </div>
</div>
{% endblock %}
